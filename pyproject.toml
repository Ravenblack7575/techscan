[project]
name = "crew"
version = "0.1.0"
description = "for running crewai multi-agent applications"
authors = [
    {name = "Elizabeth Lim",email = "gatheringdusthere@gmail.com"}
]
readme = "README.md"
package-mode = false

requires-python = ">=3.11,<=3.13"
dependencies = [
    "crewai (>=0.175.0,<0.176.0)",
    "crewai-tools (>=0.65.0,<0.66.0)",
    "ipykernel (>=6.30.1,<7.0.0)"
]

[tool.poetry]

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
ruff = "^0.12.11"
pytest = "^8.4.1"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
